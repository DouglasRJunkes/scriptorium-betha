<script id="init-data" type="application/json">{"scripts": [{"id": "s_recovered_lotescontabeis", "title": "Exclusão de lotes Contabeis", "system": "Tributos", "description": "Realiza a exclusão de todos os lotes contábeis disponíveis na entidade, sem distinção.\nNecessario executar somente 1 vez.", "script": "//Fonte de dados\nfonteIntegracoesContabeis = Dados.tributos.v2.integracoesContabeis\n\n//Filtro: só ARRECADACOES em HOMOLOGACAO\nfiltroIntegracoesContabeis = \"tipoIntegracao = 'ARRECADACOES' and situacao = 'EM_HOMOLOGACAO'\"\n\n// Monta lista com os itens que vamos excluir\npayload = []\n\ndadosIntegracoesContabeis = fonteIntegracoesContabeis.busca(criterio: filtroIntegracoesContabeis)\n\npercorrer (dadosIntegracoesContabeis) { itemIntegracoesContabeis ->\n  payload << [\n    \"idIntegracao\": \"INTEGRACAO \" + itemIntegracoesContabeis.id,\n    \"integracoesContabeis\": [\n      \"idGerado\": [\n        \"id\": itemIntegracoesContabeis.id\n      ]\n    ]\n  ]\n}\n\n// Quebra em lotes de no máximo 50 itens (exigência do endpoint)\npayload = payload.collate(50)\n\n// Se tiver algo pra excluir\nif (payload) {\n  payload.each { lote ->\n    servico = Http.servico(\"https://tributos.betha.cloud/service-layer-tributos/api/integracoesContabeis\")\n    .cabecalho(\"Content-Type\", \"application/json\")\n    .chaveIntegracao(Variavel.CHAVE_INTEGRACAO)\n    .DELETE(lote, Http.JSON)\n    \n    imprimir 'JSON: ' + servico.codigo() + ' - ' + servico.conteudo()\n  }\n} else {\n  imprimir \"Nenhuma integração encontrada para exclusão.\"\n}", "author": "Douglas Junkes", "createdAt": "2026-08-24T14:00:04.000Z", "updatedAt": "2026-08-24T14:00:04.000Z"}]}</script>

    var inserted = next.filter(function (s) { return !prevMap[s.id]; });
    var deleted = prev.filter(function (s) { return !nextMap[s.id]; });

        method: "POST",
        headers: supabaseHeaders({ "Prefer": "return=minimal" }),
        body: JSON.stringify([scriptToRow(s)])

    });
    diff.updated.forEach(function (s) {
      ops.push(fetch(SUPABASE_URL + "/rest/v1/scripts?id=eq." + encodeURIComponent(s.id), {

        headers: supabaseHeaders({ "Prefer": "return=minimal" }),

    diff.deleted.forEach(function (s) {

    var activeDayEvery = dayType === "dom" ? dom.mode === "every" : dow.mode === "every";

    var allEvery = second.mode === "every" && minute.mode === "every" && hour.mode === "every" &&
      activeDayEvery && month.mode === "every" && year.mode === "every";
    if (allEvery) return "Executa a cada segundo.";

    var secondTrivial = second.mode === "every" || (singleSpecific(second) && second.specific[0] === 0);

    if (secondTrivial && minute.mode === "increment" && hour.mode === "every" && activeDayEvery && month.mode === "every" && year.mode === "every") {
      return "Executa a cada " + minute.increment.step + " minuto(s).";

    if (secondTrivial && singleSpecific(minute) && singleSpecific(hour) && activeDayEvery && month.mode === "every" && year.mode === "every") {
      var hh = pad2(hour.specific[0]);

    if (secondTrivial && singleSpecific(minute) && singleSpecific(hour) && month.mode === "every" && year.mode === "every") {

      }

        return "Executa as " + hh2 + ":" + mm2 + ", de " + dowNames[clampInt(dow.range.from, 1, 7) - 1] + " a " + dowNames[clampInt(dow.range.to, 1, 7) - 1] + ".";
      }

    if (hour.mode !== "every") { var dh = describeField(fieldByKey("hour"), hour); if (dh) clauses.push("hora: " + dh); }

  function b64Process() {
    var input = qs("#b64Input");

    var errorEl = qs("#b64Error");
    var statsEl = qs("#b64Stats");
    var charsetEl = qs("#b64Charset");
    var urlSafeEl = qs("#b64UrlSafe");
    if (!input || !output || !errorEl || !statsEl || !charsetEl || !urlSafeEl) return;
    var charset = charsetEl.value;
    var urlSafe = urlSafeEl.checked;

  function smBuildExtractScript(query, vars, fileType) {
    var m = query.match(/percorrer\s*\(\s*([A-Za-z_$][\w$]*)\s*\)\s*\{\s*([A-Za-z_$][\w$]*)\s*->/);
    if (!m) return null;
    var setup = query.slice(0, m.index).replace(/\s+$/, "");
    var collectionVar = m[1];
    var iterVar = m[2];
    var ext = fileType === "csv" ? "csv" : "txt";
    var fileName = "Resultado." + ext;
    var lines = setup.length ? setup.split("\n") : [];
    lines.push("arquivo = Arquivo.novo('" + fileName + "', '" + ext + "', [encoding: 'UTF-8'])");
    lines.push("percorrer (" + collectionVar + ") { " + iterVar + " ->");
    var fields = vars.map(function (v) { return (v || "").trim(); }).filter(function (v) { return v.length > 0; });
    if (!fields.length) return { error: "novars" };
    if (fields.length === 1) {
      lines.push("    arquivo.escrever(" + iterVar + "." + fields[0] + ".toString())");
    } else {
      var parts = fields.map(function (field, idx) {
        return idx === 0
          ? "${" + iterVar + "." + field + "}"
          : "${" + iterVar + "." + field + " ?: ''}";
      });
      lines.push("    arquivo.escrever(\"" + parts.join(";") + "\")");
    }
    lines.push("    arquivo.novaLinha()");
    lines.push("}");
    lines.push("Resultado.arquivo(arquivo, '" + fileName + "')");
    return { script: lines.join("\n") };
  }

  function smBuildApiScript(query, apiUrl, paramsText, varNames, httpMethod) {
    if (!apiUrl) return { error: "nourl" };
    var template;
    try {
      var parsed = JSON.parse(paramsText);
      template = Array.isArray(parsed) ? parsed[0] : parsed;
    } catch (e) {
      return { error: "invalidjson" };
    }
    if (!template || typeof template !== "object") return { error: "invalidjson" };

    var m = query.match(/percorrer\s*\(\s*([A-Za-z_$][\w$]*)\s*\)\s*\{\s*([A-Za-z_$][\w$]*)\s*->/);
    if (!m) return { error: "nopercorrer" };
    var setup = query.slice(0, m.index).replace(/\s+$/, "");
    var collectionVar = m[1];
    var iterVar = m[2];

    var buscaLineRegex = /^(\s*)([A-Za-z_$][\w$]*)\s*=\s*(.+?)\.busca\(([^)]*)\)\s*$/m;
    var buscaMatch = setup.match(buscaLineRegex);
    if (!buscaMatch) return { error: "nobusca" };
    var buscaArgs = buscaMatch[4];
    var criterioMatch = buscaArgs.match(/criterio\s*:\s*([A-Za-z_$][\w$]*)/);
    var camposMatch = buscaArgs.match(/campos\s*:\s*"([^"]*)"/);
    var filtroVarName = criterioMatch ? criterioMatch[1] : null;
    var existingCampos = camposMatch
      ? camposMatch[1].split(",").map(function (s) { return s.trim(); }).filter(Boolean)
      : [];

    var filtroMap = {};
    if (filtroVarName) {
      var filtroAssignRegex = new RegExp("^\\s*" + filtroVarName + "\\s*=\\s*\"([^\"]*)\"", "m");
      var filtroAssignMatch = setup.match(filtroAssignRegex);
      if (filtroAssignMatch) {
        filtroAssignMatch[1].split(/\s+(?:and|AND|&&)\s+/).forEach(function (clause) {
          var clauseMatch = clause.match(/^\s*([A-Za-z_$][\w$]*)\s*=\s*(.+?)\s*$/);
          if (!clauseMatch) return;
          var ck = clauseMatch[1];
          var cv = clauseMatch[2].trim();
          var isNumeric = /^-?\d+(\.\d+)?$/.test(cv);
          if (!isNumeric && /^['"].*['"]$/.test(cv)) {
            cv = cv.slice(1, -1);
          }
          filtroMap[ck.toLowerCase()] = { rawValue: cv, isNumeric: isNumeric };
        });
      }
    }

    var varList = (varNames || []).map(function (v) { return (v || "").trim(); }).filter(Boolean);
    var usedVars = [];
    var placeholders = [];

    function resolveLeaf(key) {
      if (key) {
        var normKey = key.toLowerCase();
        if (normKey === "idintegracao") {
          return "'1'";
        }
        var matchedVar = varList.filter(function (v) { return v.toLowerCase() === normKey; })[0];
        if (matchedVar) {
          if (usedVars.indexOf(matchedVar) === -1) usedVars.push(matchedVar);
          return iterVar + "." + matchedVar;
        }
        if (filtroMap[normKey]) {
          var f = filtroMap[normKey];
          return f.isNumeric ? f.rawValue : ("'" + f.rawValue.replace(/'/g, "\\'") + "'");
        }
      }
      if (placeholders.indexOf(key) === -1) placeholders.push(key);
      return "null /* TODO: definir origem de \"" + key + "\" */";
    }

    function groovyLiteral(value, indent, keyForLeaf) {
      var innerIndent = indent + "    ";
      if (Array.isArray(value)) {
        if (!value.length) return "[]";
        var items = value.map(function (v) { return innerIndent + groovyLiteral(v, innerIndent, keyForLeaf); });
        return "[\n" + items.join(",\n") + "\n" + indent + "]";
      }
      if (value && typeof value === "object") {
        var keys = Object.keys(value);
        if (!keys.length) return "[:]";
        var entries = keys.map(function (k) {
          return innerIndent + k + ": " + groovyLiteral(value[k], innerIndent, k);
        });
        return "[\n" + entries.join(",\n") + "\n" + indent + "]";
      }
      return resolveLeaf(keyForLeaf);
    }

    var payloadLiteral = groovyLiteral(template, "    ", null);

    var mergedCampos = existingCampos.slice();
    usedVars.forEach(function (v) {
      var already = mergedCampos.some(function (c) { return c.toLowerCase() === v.toLowerCase(); });
      if (!already) mergedCampos.push(v);
    });

    var newBuscaLine = buscaMatch[1] + buscaMatch[2] + " = " + buscaMatch[3] +
      ".busca(criterio: " + (filtroVarName || "") + ", campos: \"" + mergedCampos.join(", ") + "\")";
    var newSetup = setup.slice(0, buscaMatch.index) + newBuscaLine + setup.slice(buscaMatch.index + buscaMatch[0].length);

    var lines = newSetup.length ? newSetup.split("\n") : [];
    lines.push("payload = []");
    if (placeholders.length) {
      lines.push("// TODO: revisar os campos abaixo antes de usar em producao (nenhuma variavel ou filtro correspondente encontrado):");
      placeholders.forEach(function (p) {
        lines.push("//   - " + p);
      });
    }
    lines.push("percorrer (" + collectionVar + ") { " + iterVar + " ->");
    lines.push("    payload << " + payloadLiteral);
    lines.push("}");
    lines.push("resposta = Http.servico(\"" + apiUrl + "\")");
    lines.push("    .chaveIntegracao(Variavel.CHAVE_INTEGRACAO)");
    var allowedMethods = ["PUT", "POST", "PATCH", "DELETE"];
    var method = (httpMethod || "").toUpperCase();
    if (allowedMethods.indexOf(method) === -1) method = "POST";
    lines.push("    ." + method + "(payload, Http.JSON)");
    lines.push("se (!resposta.sucesso()) {");
    lines.push("    suspender \"Erro ao enviar dados: ${resposta.codigo()} - ${resposta.conteudo()}\"");
    lines.push("}");
    lines.push("retornar resposta.conteudo()");

    return { script: lines.join("\n"), placeholders: placeholders };
  }

  function smBuildApiLoteScript(query, apiUrl, httpMethod, paramsText, listVarName) {
    if (!listVarName) return { error: "nolistvar" };
    if (!apiUrl) return { error: "nourl" };
    var template;
    try {
      var parsed = JSON.parse(paramsText);
      template = Array.isArray(parsed) ? parsed[0] : parsed;
    } catch (e) {
      return { error: "invalidjson" };
    }
    if (!template || typeof template !== "object") return { error: "invalidjson" };

    var allowedMethods = ["PUT", "POST", "PATCH", "DELETE"];
    var method = (httpMethod || "").toUpperCase();
    if (allowedMethods.indexOf(method) === -1) method = "POST";

    function formatLiteral(value) {
      if (value === null) return "null";
      if (typeof value === "boolean") return value ? "true" : "false";
      if (typeof value === "number") return String(value);
      return "'" + String(value).replace(/'/g, "\\'") + "'";
    }

    function groovyLiteralLote(value, indent, keyForLeaf) {
      var innerIndent = indent + "    ";
      if (Array.isArray(value)) {
        if (!value.length) return "[]";
        var items = value.map(function (v) { return innerIndent + groovyLiteralLote(v, innerIndent, keyForLeaf); });
        return "[\n" + items.join(",\n") + "\n" + indent + "]";
      }
      if (value && typeof value === "object") {
        var keys = Object.keys(value);
        if (!keys.length) return "[:]";
        var entries = keys.map(function (k) {
          return innerIndent + k + ": " + groovyLiteralLote(value[k], innerIndent, k);
        });
        return "[\n" + entries.join(",\n") + "\n" + indent + "]";
      }
      if (keyForLeaf) {
        var normKey = keyForLeaf.toLowerCase();
        if (normKey === "id") return "id";
        if (normKey === "idintegracao") return "\"INTEGRACAO_${id}\"";
      }
      return formatLiteral(value);
    }

    var payloadLiteral = groovyLiteralLote(template, "        ", null);

    var warnings = [];
    if (query.indexOf(listVarName) === -1) {
      warnings.push("A variavel \"" + listVarName + "\" nao foi encontrada na consulta informada - confirme se o nome esta correto.");
    }

    var lines = [];
    lines.push(query.replace(/\s+$/, ""));
    lines.push("");
    lines.push("// ==========================================================");
    lines.push("// Integracao - envio para API externa (" + method + ")");
    lines.push("// ==========================================================");
    lines.push("URL_API = \"" + apiUrl + "\"");
    lines.push("CHAVE_INTEGRACAO_API = Variavel?.CHAVE_INTEGRACAO");
    lines.push("");
    lines.push("esquemaLog = [");
    lines.push("    id            : Esquema.inteiro,");
    lines.push("    idIntegracao  : Esquema.caracter,");
    lines.push("    codigoRetorno : Esquema.caracter,");
    lines.push("    sucesso       : Esquema.caracter,");
    lines.push("    mensagem      : Esquema.caracter");
    lines.push("]");
    lines.push("fonteLog = Dados.dinamico.v2.novo(esquemaLog)");
    lines.push("");
    lines.push("se (" + listVarName + ".isEmpty()) {");
    lines.push("    retornar fonteLog");
    lines.push("}");
    lines.push("");
    lines.push("TAMANHO_LOTE = 50");
    lines.push(listVarName + ".collate(TAMANHO_LOTE).each { lote ->");
    lines.push("    payload = lote.collect { id ->");
    lines.push("        " + payloadLiteral);
    lines.push("    }");
    lines.push("    tentar {");
    lines.push("        resposta = Http.servico(URL_API)");
    lines.push("            .chaveIntegracao(CHAVE_INTEGRACAO_API)");
    lines.push("            ." + method + "(payload, Http.JSON)");
    lines.push("    } tratar {");
    lines.push("        esperar 2.segundo");
    lines.push("        resposta = Http.servico(URL_API)");
    lines.push("            .chaveIntegracao(CHAVE_INTEGRACAO_API)");
    lines.push("            ." + method + "(payload, Http.JSON)");
    lines.push("    }");
    lines.push("    codigoHttp  = resposta.codigo()");
    lines.push("    loteOk      = (codigoHttp == 200 || codigoHttp == 201 || codigoHttp == 204)");
    lines.push("    conteudoRes = resposta.conteudo()");
    lines.push("    lote.each { id ->");
    lines.push("        fonteLog.inserirLinha([");
    lines.push("            id            : id,");
    lines.push("            idIntegracao  : \"INTEGRACAO_${id}\",");
    lines.push("            codigoRetorno : \"${codigoHttp}\",");
    lines.push("            sucesso       : loteOk ? \"SIM\" : \"NAO\",");
    lines.push("            mensagem      : loteOk ? \"Atualizado com sucesso\" : conteudoRes");
    lines.push("        ])");
    lines.push("    }");
    lines.push("}");
    lines.push("retornar fonteLog");

    return { script: lines.join("\n"), warnings: warnings };
  }

  function wireSmGenerate() {
    var btn = qs("#smGenerateBtn");
    var input = qs("#smQueryInput");
    var output = qs("#smOutput");
    if (!btn || !input || !output) return;
    btn.addEventListener("click", function () {
      var query = input.value.trim();
      if (!query) {
        showToast("Cole a consulta antes de gerar.", "error");
        return;
      }
      if (smSelectedOption === "extrair_arquivo") {
        var vars = [1, 2, 3, 4, 5].map(function (i) {
          var field = qs("#smVar" + i);
          return field ? field.value : "";
        });
        var result = smBuildExtractScript(query, vars, smFileType);
        if (!result) {
          showToast("Nao foi possivel localizar o bloco \"percorrer\" na consulta.", "error");
          return;
        }
        if (result.error === "novars") {
          showToast("Informe ao menos uma variavel para gerar o script.", "error");
          return;
        }
        output.textContent = result.script;
        return;
      }
      if (smSelectedOption === "usar_api") {
        var apiUrl = (qs("#smApiUrl") || {}).value || "";
        var apiMethod = (qs("#smApiMethod") || {}).value || "POST";
        var paramsText = (qs("#smApiParams") || {}).value || "";

        if (smApiMode === "lote") {
          var listVarName = ((qs("#smApiListVar") || {}).value || "").trim();
          var loteResult = smBuildApiLoteScript(query, apiUrl.trim(), apiMethod, paramsText.trim(), listVarName);
          if (loteResult.error === "nolistvar") {
            showToast("Informe o nome da variavel de saida (lista de IDs).", "error");
            return;
          }
          if (loteResult.error === "nourl") {
            showToast("Informe a URL da API.", "error");
            return;
          }
          if (loteResult.error === "invalidjson") {
            showToast("JSON de parametros invalido. Verifique a sintaxe.", "error");
            return;
          }
          output.textContent = loteResult.script;
          if (loteResult.warnings && loteResult.warnings.length) {
            showToast(loteResult.warnings[0], "error");
          }
          return;
        }

        var apiVars = [1, 2, 3, 4, 5].map(function (i) {
          var field = qs("#smVar" + i);
          return field ? field.value : "";
        });
        var apiResult = smBuildApiScript(query, apiUrl.trim(), paramsText.trim(), apiVars, apiMethod);
        if (apiResult.error === "nourl") {
          showToast("Informe a URL da API.", "error");
          return;
        }
        if (apiResult.error === "invalidjson") {
          showToast("JSON de parametros invalido. Verifique a sintaxe.", "error");
          return;
        }
        if (apiResult.error === "nopercorrer") {
          showToast("Nao foi possivel localizar o bloco \"percorrer\" na consulta.", "error");
          return;
        }
        if (apiResult.error === "nobusca") {
          showToast("Nao foi possivel localizar uma chamada \"busca(...)\" com criterio/campos na consulta.", "error");
          return;
        }
        output.textContent = apiResult.script;
        if (apiResult.placeholders && apiResult.placeholders.length) {
          showToast("Script gerado com " + apiResult.placeholders.length + " campo(s) sem origem identificada - revise os TODOs.", "info");
        }
        return;
      }
      var opt = SM_OPTIONS.filter(function (o) { return o.key === smSelectedOption; })[0];
      output.textContent = "// Geracao para \"" + (opt ? opt.label : "") + "\" ainda nao configurada.\n// Em breve este botao vai gerar o script completo a partir da consulta informada.";
    });
  }

  function publishScripts(nextScripts, opts) {
    opts = opts || {};
    if (!writable) {
      if (opts.onError) opts.onError("Este repositorio esta em modo somente leitura para voce.");
      return;
    }
    if (capability) {
      attemptPublish(nextScripts, opts, false);
      return;
    }
    if (supabaseConfigured()) {
      attemptSupabaseSave(nextScripts, opts);
      return;
    }
    if (opts.onError) opts.onError("Nao e possivel salvar alteracoes neste visualizador.");
    else showToast("Nao e possivel salvar alteracoes neste visualizador.", "error");
  }

  function attemptPublish(nextScripts, opts, isRetry) {
    var html = buildDocument(nextScripts);
    capability.publish(html).then(function () {
      // success: this view reloads automatically to the new version.
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        if (opts.onError) opts.onError("Alguem salvou uma alteracao ao mesmo tempo - atualizando a pagina...");
        return;
      }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
        writable = false;
        showReadonlyBanner();
        if (opts.onError) opts.onError("Voce nao tem permissao para editar este repositorio.");
        return;
      }
      if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
        writable = false;
        showReadonlyBanner();
        if (opts.onError) opts.onError("Salvar nao esta disponivel neste momento.");
        return;
      }
      if (code === "too_large") {
        if (opts.onError) opts.onError("O script e grande demais para ser salvo.");
        return;
      }
      if (code === "rate_limited") {
        if (opts.onError) opts.onError("Muitas alteracoes em pouco tempo - aguarde um instante e tente novamente.");
        return;
      }
      if (code === "upstream_error" && !isRetry) {
        setTimeout(function () { attemptPublish(nextScripts, opts, true); }, 700 + Math.random() * 500);
        return;
      }
      if (opts.onError) opts.onError("Nao foi possivel salvar. Tente novamente.");
    });
  }

  var PAGES = ["scripts", "apimaker", "cron", "base64", "bfcscript", "apistributos", "apisprocuradoria", "apisenotafly", "apisenotacloud", "apilivroeletronico"];

  function switchPage(page) {
    if (PAGES.indexOf(page) === -1) return;
    PAGES.forEach(function (p) {
      var sec = qs("#page-" + p);
      if (sec) sec.hidden = (p !== page);
    });
    qsa(".nav-item").forEach(function (btn) {
      var isActive = btn.getAttribute("data-page") === page;
      btn.classList.toggle("active", isActive);
      if (isActive) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
  }

  function wireSidebar() {
    qsa(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () { switchPage(btn.getAttribute("data-page")); });
    });
  }

  function wireToolbar() {
    var searchInput = qs("#searchInput");
    var systemFilter = qs("#systemFilter");
    var addBtn = qs("#addBtn");
    if (searchInput) {
      var t;
      searchInput.addEventListener("input", function () {
        clearTimeout(t);
        var val = searchInput.value;
        t = setTimeout(function () { filterText = val; renderGrid(); }, 120);
      });
    }
    if (systemFilter) {
      systemFilter.addEventListener("change", function () { filterSystem = systemFilter.value; renderGrid(); });
    }
    if (addBtn) addBtn.addEventListener("click", function () { openForm(null); });
    var emptyBtn = qs("#emptyActionBtn");
    if (emptyBtn) emptyBtn.addEventListener("click", function () { openForm(null); });
  }

  function loadInitialData() {
    var node = qs("#init-data");
    var data = { scripts: [] };
    if (node) {
      try { data = JSON.parse(node.textContent) || { scripts: [] }; } catch (e) {}
    }
    scripts = (data && data.scripts) || [];
  }

  function init() {
    var root = qs("#root");
    if (root) root.innerHTML = ROOT_SHELL_HTML;
    loadInitialData();
    wireToolbar();
    wireSidebar();
    wireCronBuilder();
    wireBase64Decoder();
    wireScriptMaker();
    renderGrid();

    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("artifact").then(function (cap) {
          capability = cap;
          if (!cap) { writable = false; showReadonlyBanner(); }
        }).catch(function () {
          capability = null; writable = false; showReadonlyBanner();
        });
      } else if (supabaseConfigured()) {
        capability = null;
        writable = true;
        loadFromSupabase();
      } else {
        capability = null; writable = false; showReadonlyBanner();
      }
    } catch (e) {
      capability = null; writable = false; showReadonlyBanner();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
