    var inserted = next.filter(function (s) { return !prevMap[s.id]; });

    var updated = next.filter(function (s) {

  function fmtDateOnly(dateStr) {

  // Arquivos de skill podem ser texto (.md, .txt) ou binarios (.skill, que e um zip).
  // Postgres/PostgREST rejeitam bytes NUL (0x00) em colunas de texto, entao qualquer
  // arquivo que nao seja UTF-8 valido e sem NUL e guardado como base64 nesta coluna.
  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = "";
    var chunkSize = 0x8000;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      var chunk = bytes.subarray(i, i + chunkSize);
      binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
  }
  function base64ToBlob(base64, mimeType) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mimeType || "application/octet-stream" });
  }

      if (!nome || !descricao) {
        errNote.textContent = "Preencha nome e descricao.";
        errNote.hidden = false;
        return;
      }
      if (!file && !(existing && existing.arquivoConteudo)) {
        errNote.textContent = "Selecione um arquivo.";
        errNote.hidden = false;
        return;
      }
      errNote.hidden = true;

      saveBtn.disabled = true; cancelBtn.disabled = true;
      saveBtn.textContent = "Salvando...";

      function finishSave(arquivoNome, arquivoConteudo, arquivoEncoding) {
        var now = new Date().toISOString();
        var next = claudeSkills.slice();
        if (existing) {
          next = next.map(function (sk) {
            if (sk.id !== existing.id) return sk;
            return {
              id: sk.id, nome: nome, descricao: descricao,
              arquivoNome: arquivoNome, arquivoConteudo: arquivoConteudo, arquivoEncoding: arquivoEncoding || "texto",
              author: sk.author || getAuthorDefault() || "", createdAt: sk.createdAt, updatedAt: now
            };
          });
        } else {
          next.push({
            id: makeId(), nome: nome, descricao: descricao,
            arquivoNome: arquivoNome, arquivoConteudo: arquivoConteudo, arquivoEncoding: arquivoEncoding || "texto",
            author: getAuthorDefault() || "", createdAt: now, updatedAt: now
          });
        }
        publishSkills(next, {
          onError: function (msg) {
            saveBtn.disabled = false; cancelBtn.disabled = false;
            saveBtn.textContent = existing ? "Salvar alteracoes" : "Adicionar skill";
            errNote.textContent = msg;
            errNote.hidden = false;
          }
        });
      }

      if (file) {
        var reader = new FileReader();
        reader.onload = function () {
          var buffer = reader.result;
          var bytes = new Uint8Array(buffer);
          var hasNul = false;
          for (var i = 0; i < bytes.length; i++) {
            if (bytes[i] === 0) { hasNul = true; break; }
          }
          var decodedText = null;
          if (!hasNul) {
            try {
              decodedText = new TextDecoder("utf-8", { fatal: true }).decode(buffer);
            } catch (e) {
              decodedText = null;
            }
          }
          if (decodedText !== null) {
            finishSave(file.name, decodedText, "texto");
          } else {
            finishSave(file.name, arrayBufferToBase64(buffer), "base64");
          }
        };
        reader.onerror = function () {
          saveBtn.disabled = false; cancelBtn.disabled = false;
          saveBtn.textContent = existing ? "Salvar alteracoes" : "Adicionar skill";
          errNote.textContent = "Nao foi possivel ler o arquivo selecionado.";
          errNote.hidden = false;
        };
        reader.readAsArrayBuffer(file);
      } else {
        finishSave(existing.arquivoNome, existing.arquivoConteudo, existing.arquivoEncoding || "texto");
      }
    });
  }

  var CRON_FIELDS = [
    { key: "second", label: "Segundo", min: 0, max: 59, everyLabel: "Todo segundo" },
    { key: "minute", label: "Minuto", min: 0, max: 59, everyLabel: "Todo minuto" },
    { key: "hour", label: "Hora", min: 0, max: 23, everyLabel: "Toda hora" },
    { key: "dom", label: "Dia do mes", min: 1, max: 31, everyLabel: "Todo dia do mes", dayField: true },
    { key: "month", label: "Mes", min: 1, max: 12, everyLabel: "Todo mes", names: ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"] },
    { key: "dow", label: "Dia da semana", min: 1, max: 7, everyLabel: "Todo dia da semana", names: ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"], dayField: true },

  function pad2(n) { n = String(n); return n.length < 2 ? "0" + n : n; }

  function joinList(arr) {

  function initCronState() {

    yearField.min = now.getFullYear();
    yearField.max = now.getFullYear() + 20;
    cronState = {};

  var CRON_PRESETS = [

  function buildFieldExpr(fieldDef, fstate) {
    if (fstate.mode === "specific") {
      var vals = (fstate.specific || []).slice().sort(function (a, b) { return a - b; });
      if (!vals.length) return "*";
      return vals.join(",");
    }
    if (fstate.mode === "range") {
      var from = clampInt(fstate.range.from, fieldDef.min, fieldDef.max);
      var to = clampInt(fstate.range.to, fieldDef.min, fieldDef.max);
      if (from > to) { var tmp = from; from = to; to = tmp; }
      return from + "-" + to;
    }
    if (fstate.mode === "increment") {
      var start = clampInt(fstate.increment.start, fieldDef.min, fieldDef.max);
      var step = Math.max(1, fstate.increment.step || 1);
      return start + "/" + step;
    }
    return "*";
  }

  function fieldExprFor(f) {
    if (f.key === "dom" && cronDayType !== "dom") return "?";
    if (f.key === "dow" && cronDayType !== "dow") return "?";
    return buildFieldExpr(f, cronState[f.key]);
  }

  function parseFieldToSet(expr, min, max) {
    var set = {};
    var parts = String(expr == null ? "" : expr).trim().split(",");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].trim();
      if (!part) continue;
      var stepMatch = part.match(/^(\*|\d+-\d+|\d+)\/(\d+)$/);
      var base, step;
      if (stepMatch) { base = stepMatch[1]; step = parseInt(stepMatch[2], 10) || 1; }
      else { base = part; step = 1; }
      var rangeMatch = base.match(/^(\d+)-(\d+)$/);
      var start, end;
      if (base === "*") { start = min; end = max; }
      else if (rangeMatch) { start = parseInt(rangeMatch[1], 10); end = parseInt(rangeMatch[2], 10); }
      else if (/^\d+$/.test(base)) { start = end = parseInt(base, 10); if (stepMatch) end = max; }
      else { continue; }
      if (start > end) { var t = start; start = end; end = t; }
      for (var v = start; v <= end; v += step) { if (v >= min && v <= max) set[v] = true; }
    }
    var out = [];
    for (var k in set) { if (Object.prototype.hasOwnProperty.call(set, k)) out.push(parseInt(k, 10)); }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function classifyFieldExpr(expr, min, max) {
    expr = String(expr == null ? "" : expr).trim();
    var st = { mode: "every", specific: [], range: { from: min, to: min }, increment: { start: min, step: 5 } };
    if (expr === "*" || expr === "" || expr === "?") { st.mode = "every"; return st; }
    var incAll = expr.match(/^\*\/(\d+)$/);
    if (incAll) { st.mode = "increment"; st.increment = { start: min, step: Math.max(1, parseInt(incAll[1], 10)) }; return st; }
    var incStart = expr.match(/^(\d+)\/(\d+)$/);
    if (incStart) {
      st.mode = "increment";
      st.increment = { start: clampInt(parseInt(incStart[1], 10), min, max), step: Math.max(1, parseInt(incStart[2], 10)) };
      return st;
    }
    var range = expr.match(/^(\d+)-(\d+)$/);
    if (range && expr.indexOf(",") === -1) {
      st.mode = "range";
      st.range = { from: clampInt(parseInt(range[1], 10), min, max), to: clampInt(parseInt(range[2], 10), min, max) };
      return st;
    }
    st.mode = "specific";
    st.specific = parseFieldToSet(expr, min, max);
    return st;
  }

  function describeField(fieldDef, fstate) {
    if (fstate.mode === "every") return null;
    if (fstate.mode === "specific") {
      var vals = (fstate.specific || []).slice().sort(function (a, b) { return a - b; });
      if (!vals.length) return null;
      var labels = vals.map(function (v) { return fieldDef.names ? fieldDef.names[v - fieldDef.min] : String(v); });
      return joinList(labels);
    }
    if (fstate.mode === "range") {
      var fLabel = fieldDef.names ? fieldDef.names[clampInt(fstate.range.from, fieldDef.min, fieldDef.max) - fieldDef.min] : fstate.range.from;
      var tLabel = fieldDef.names ? fieldDef.names[clampInt(fstate.range.to, fieldDef.min, fieldDef.max) - fieldDef.min] : fstate.range.to;
      return "de " + fLabel + " a " + tLabel;
    }
    if (fstate.mode === "increment") {
      return "a cada " + fstate.increment.step + " a partir de " + fstate.increment.start;
    }
    return null;
  }

  function singleSpecific(f) { return f.mode === "specific" && (f.specific || []).length === 1; }

  function describeCron(state, dayType) {
    var second = state.second, minute = state.minute, hour = state.hour;
    var dom = state.dom, month = state.month, dow = state.dow, year = state.year;
    var dowNames = fieldByKey("dow").names;
    var activeDayEvery = dayType === "dom" ? dom.mode === "every" : dow.mode === "every";

    var allEvery = second.mode === "every" && minute.mode === "every" && hour.mode === "every" &&
      activeDayEvery && month.mode === "every" && year.mode === "every";
    if (allEvery) return "Executa a cada segundo.";

    var secondTrivial = second.mode === "every" || (singleSpecific(second) && second.specific[0] === 0);

    if (secondTrivial && minute.mode === "increment" && hour.mode === "every" && activeDayEvery && month.mode === "every" && year.mode === "every") {
      return "Executa a cada " + minute.increment.step + " minuto(s).";
    }

    if (secondTrivial && singleSpecific(minute) && singleSpecific(hour) && activeDayEvery && month.mode === "every" && year.mode === "every") {
      var hh = pad2(hour.specific[0]);
      var mm = pad2(minute.specific[0]);
      return "Executa todos os dias as " + hh + ":" + mm + ".";
    }

    if (secondTrivial && singleSpecific(minute) && singleSpecific(hour) && month.mode === "every" && year.mode === "every") {
      var hh2 = pad2(hour.specific[0]);
      var mm2 = pad2(minute.specific[0]);
      if (dayType === "dow" && dow.mode === "specific" && (dow.specific || []).length) {
        var labels = dow.specific.slice().sort(function (a, b) { return a - b; }).map(function (v) { return dowNames[v - 1]; });
        return "Executa as " + hh2 + ":" + mm2 + ", em " + joinList(labels) + ".";
      }
      if (dayType === "dow" && dow.mode === "range") {
        return "Executa as " + hh2 + ":" + mm2 + ", de " + dowNames[clampInt(dow.range.from, 1, 7) - 1] + " a " + dowNames[clampInt(dow.range.to, 1, 7) - 1] + ".";
      }
      if (dayType === "dom" && dom.mode === "specific" && (dom.specific || []).length === 1) {
        return "Executa todo dia " + dom.specific[0] + " do mes as " + hh2 + ":" + mm2 + ".";
      }
    }

    var clauses = [];
    if (second.mode !== "every") { var ds = describeField(fieldByKey("second"), second); if (ds) clauses.push("segundo: " + ds); }
    if (minute.mode !== "every") { var dmi = describeField(fieldByKey("minute"), minute); if (dmi) clauses.push("minuto: " + dmi); }
    if (hour.mode !== "every") { var dh = describeField(fieldByKey("hour"), hour); if (dh) clauses.push("hora: " + dh); }
    if (dayType === "dom") {
      if (dom.mode !== "every") { var ddom = describeField(fieldByKey("dom"), dom); if (ddom) clauses.push("dia do mes: " + ddom); }
    } else {
      if (dow.mode !== "every") { var ddow = describeField(fieldByKey("dow"), dow); if (ddow) clauses.push("dia da semana: " + ddow); }
    }
    if (month.mode !== "every") { var dmo = describeField(fieldByKey("month"), month); if (dmo) clauses.push("mes: " + dmo); }
    if (year.mode !== "every") { var dy = describeField(fieldByKey("year"), year); if (dy) clauses.push("ano: " + dy); }

    if (!clauses.length) return "Executa a cada segundo.";
    return "Executa quando " + clauses.join("; ") + ".";
  }

  function computeNextRuns(parts, count) {
    var yearField = fieldByKey("year");
    var secSet = parseFieldToSet(parts.second, 0, 59);
    var minSet = parseFieldToSet(parts.minute, 0, 59);
    var hourSet = parseFieldToSet(parts.hour, 0, 23);
    var domSet = parts.dom === "?" ? null : parseFieldToSet(parts.dom, 1, 31);
    var monthSet = parseFieldToSet(parts.month, 1, 12);
    var dowSet = parts.dow === "?" ? null : parseFieldToSet(parts.dow, 1, 7);
    var yearSet = parseFieldToSet(parts.year, yearField.min, yearField.max);
    if (!secSet.length || !minSet.length || !hourSet.length || !monthSet.length || !yearSet.length) return [];
    if (domSet !== null && !domSet.length && dowSet !== null && !dowSet.length) return [];

    var minH = {}; minSet.forEach(function (v) { minH[v] = true; });
    var hourH = {}; hourSet.forEach(function (v) { hourH[v] = true; });
    var domH = null; if (domSet !== null) { domH = {}; domSet.forEach(function (v) { domH[v] = true; }); }
    var monthH = {}; monthSet.forEach(function (v) { monthH[v] = true; });
    var dowH = null; if (dowSet !== null) { dowH = {}; dowSet.forEach(function (v) { dowH[v] = true; }); }
    var yearH = {}; yearSet.forEach(function (v) { yearH[v] = true; });

    var results = [];
    var d = new Date();
    d.setMilliseconds(0);
    var startSecondOffset = d.getSeconds() + 1;
    d.setSeconds(0, 0);
    var firstMinute = true;
    var maxIterations = 60 * 24 * 366 * 3;
    var iter = 0;
    while (results.length < count && iter < maxIterations) {
      iter++;
      var yr = d.getFullYear();
      if (!yearH[yr]) { d.setFullYear(d.getFullYear() + 1, 0, 1); d.setHours(0, 0, 0, 0); firstMinute = false; continue; }
      var mo = d.getMonth() + 1;
      if (!monthH[mo]) { d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0, 0, 0); firstMinute = false; continue; }
      var domOk = domH === null ? true : !!domH[d.getDate()];
      var quartzDow = d.getDay() + 1;
      var dowOk = dowH === null ? true : !!dowH[quartzDow];
      if (!(domOk && dowOk)) { d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); firstMinute = false; continue; }
      if (!hourH[d.getHours()]) { d.setHours(d.getHours() + 1, 0, 0, 0); firstMinute = false; continue; }
      if (!minH[d.getMinutes()]) { d.setMinutes(d.getMinutes() + 1, 0, 0); firstMinute = false; continue; }

      var secStart = firstMinute ? startSecondOffset : 0;
      for (var i = 0; i < secSet.length && results.length < count; i++) {
        if (secSet[i] >= secStart) {
          var candidate = new Date(d.getTime());
          candidate.setSeconds(secSet[i], 0);
          results.push(candidate);
        }
      }
      firstMinute = false;
      d.setMinutes(d.getMinutes() + 1, 0, 0);
    }
    return results;
  }

  var b64Mode = "decode";

  function b64BytesToBinaryString(bytes) {
    var out = "";
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      out += String.fromCharCode.apply(null, bytes.subarray ? bytes.subarray(i, i + chunk) : bytes.slice(i, i + chunk));
    }
    return out;
  }
  function b64UrlToStandard(str) { return str.replace(/-/g, "+").replace(/_/g, "/"); }
  function b64StandardToUrl(str) { return str.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

  function b64Decode(str, charset, urlSafe) {
    var cleaned = str.replace(/\s+/g, "");
    if (urlSafe) cleaned = b64UrlToStandard(cleaned);
    while (cleaned.length % 4 !== 0) cleaned += "=";
    var binary = atob(cleaned);
    if (charset === "latin1") return binary;
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  }

  function b64Encode(str, charset, urlSafe) {
    var bytes;
    if (charset === "latin1") {
      bytes = new Uint8Array(str.length);
      for (var i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xFF;
    } else {
      bytes = new TextEncoder().encode(str);
    }
    var binary = b64BytesToBinaryString(bytes);
    var out = btoa(binary);
    if (urlSafe) out = b64StandardToUrl(out);
    return out;
  }

  function b64Process() {
    var input = qs("#b64Input");
    var output = qs("#b64Output");
    var errorEl = qs("#b64Error");
    var statsEl = qs("#b64Stats");
    var charsetEl = qs("#b64Charset");
    var urlSafeEl = qs("#b64UrlSafe");
    if (!input || !output || !errorEl || !statsEl || !charsetEl || !urlSafeEl) return;
    var charset = charsetEl.value;
    var urlSafe = urlSafeEl.checked;
    var raw = input.value;
    errorEl.hidden = true;
    if (!raw) { output.value = ""; statsEl.textContent = ""; return; }
    try {
      if (b64Mode === "decode") {
        var text = b64Decode(raw, charset, urlSafe);
        output.value = text;
        statsEl.textContent = raw.replace(/\s+/g, "").length + " caracteres em Base64 -> " + text.length + " caracteres decodificados.";
      } else {
        var encoded = b64Encode(raw, charset, urlSafe);
        output.value = encoded;
        statsEl.textContent = raw.length + " caracteres -> " + encoded.length + " caracteres em Base64.";
      }
    } catch (e) {
      output.value = "";
      statsEl.textContent = "";
      errorEl.textContent = b64Mode === "decode"
        ? "Base64 invalido: verifique se o texto colado esta completo e sem caracteres extras."
        : "Nao foi possivel codificar o texto informado.";
      errorEl.hidden = false;
    }
  }

    var overlay = el("div", { "class": "modal-overlay", role: "presentation" });
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeModal(); });
    overlay.addEventListener("keydown", onOverlayKeydown);

    var panel = el("div", { "class": "modal-panel wide", role: "dialog", "aria-modal": "true", "aria-labelledby": "importModalTitle" });

    var header = el("div", { "class": "modal-header" });
    header.appendChild(el("h2", { id: "importModalTitle" }, 'Colar script "' + name + '"'));
    var closeBtn = el("button", { "class": "icon-btn", type: "button", "aria-label": "Fechar" }, "✕");
    closeBtn.addEventListener("click", closeModal);
    header.appendChild(closeBtn);
    panel.appendChild(header);

    var body = el("div", { "class": "modal-body" });
    body.appendChild(el("p", { "class": "sm-option-hint" }, 'Cole aqui o conteudo completo do script "' + name + '", usado pelo script principal atraves de importar "' + name + '".'));
    var textarea = el("textarea", { "class": "b64-textarea", id: "importScriptTextarea", rows: "14" });
    textarea.value = smImportedScripts[name] || "";
    body.appendChild(textarea);
    panel.appendChild(body);

    var footer = el("div", { "class": "modal-footer" });
    var cancelBtn = el("button", { "class": "btn btn-secondary", type: "button" }, "Cancelar");
    cancelBtn.addEventListener("click", closeModal);
    var saveBtn = el("button", { "class": "btn btn-primary", type: "button" }, "Salvar");
    saveBtn.addEventListener("click", function () {
      smImportedScripts[name] = textarea.value.trim();
      closeModal();
      renderSmImportsCard(smFindImportedScriptNames(((qs("#smQueryInput") || {}).value || "")));
    });
    footer.appendChild(cancelBtn);
    footer.appendChild(saveBtn);
    panel.appendChild(footer);

    overlay.appendChild(panel);
    layer.appendChild(overlay);
    textarea.focus();
  }

  function collectSmAiPayload() {
    var query = ((qs("#smQueryInput") || {}).value || "").trim();
    var payload = { mode: smSelectedOption, query: query };
    if (smSelectedOption === "extrair_arquivo") {
      payload.fileType = smFileType;
    } else if (smSelectedOption === "usar_api") {
      payload.apiMode = smApiMode;
      payload.apiUrl = ((qs("#smApiUrl") || {}).value || "").trim();
      payload.apiMethod = (qs("#smApiMethod") || {}).value || "POST";
      payload.apiParams = ((qs("#smApiParams") || {}).value || "").trim();
    } else if (smSelectedOption === "corrigir_script") {
      payload.errorMessage = ((qs("#smErrorInput") || {}).value || "").trim();
      payload.context = ((qs("#smContextInput") || {}).value || "").trim();
      var importNames = smFindImportedScriptNames(query);
      if (importNames.length) {
        payload.importedScripts = importNames.map(function (name) {
          return { name: name, content: smImportedScripts[name] || "" };
        });
      }
    }
    return payload;
  }
  function smGenerateWithAi(payload) {
    return fetch(SUPABASE_URL + "/functions/v1/gerar-script-ia", {
      method: "POST",
      headers: supabaseHeaders(),
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (res.status === 401) handleAuthExpired();
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          throw new Error((data && data.error) || ("http_" + res.status));
        }
        return data;
      });
    });
  }
  function wireSmGenerateAi() {
    var btn = qs("#smGenerateAiBtn");
    var input = qs("#smQueryInput");
    var output = qs("#smOutput");
    if (!btn || !input || !output) return;
    btn.addEventListener("click", function () {
      var query = input.value.trim();
      if (!query) {
        showToast(smSelectedOption === "corrigir_script" ? "Cole o script com erro antes de gerar." : "Cole a consulta antes de gerar.", "error");
        return;
      }
      if (smSelectedOption === "usar_api") {
        var apiUrl = ((qs("#smApiUrl") || {}).value || "").trim();
        if (!apiUrl) {
          showToast("Informe a URL da API.", "error");
          return;
        }
      }
      if (smSelectedOption === "corrigir_script") {
        var errorMessage = ((qs("#smErrorInput") || {}).value || "").trim();
        if (!errorMessage) {
          showToast("Cole a mensagem de erro antes de gerar.", "error");
          return;
        }
        var importNames = smFindImportedScriptNames(query);
        renderSmImportsCard(importNames);
        var missingImports = importNames.filter(function (name) {
          return !(smImportedScripts[name] && smImportedScripts[name].trim());
        });
        if (missingImports.length) {
          showToast("Cole o conteudo dos scripts importados antes de gerar.", "error");
          return;
        }
      }
      var payload = collectSmAiPayload();
      var originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Gerando...";
      smGenerateWithAi(payload).then(function (data) {
        output.textContent = data.script || "";
        showToast("Script gerado com IA. Revise antes de usar.", "info");
      }).catch(function (err) {
        var msg = (err && err.message) || "";
        var friendly = (msg && !/^http_\d+$/.test(msg)) ? msg : "Nao foi possivel gerar o script com IA. Tente novamente.";
        showToast(friendly, "error");
      }).then(function () {
        btn.disabled = false;
        btn.textContent = originalLabel;
      });
    });
  }

  function wireSmCopy() {
    var btn = qs("#smCopyBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var text = qs("#smOutput").textContent;
      if (!text) return;
      var done = function () { btn.textContent = "Copiado!"; setTimeout(function () { btn.textContent = "Copiar"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    });
  }

  function wireScriptMaker() {
    smSelectedOption = SM_OPTIONS[0].key;
    smFileType = "txt";
    smApiMode = "single";
    renderSmOptions();
    wireSmFileType();
    wireSmApiMode();
    wireSmGenerateAi();
    wireSmCopy();
    updateSmAiButtonVisibility();
  }

  function buildDocument(nextScripts, nextSkills) {
    var styleText = qs("#app-style").textContent;
    var appJsText = qs("#app-js").textContent;
    var dataJson = escapeCloseScript(JSON.stringify({ scripts: nextScripts, claudeSkills: nextSkills }));
    var html = "<!doctype html>\n<html>\n<head>\n" +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>Scriptorium Betha</title>\n" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">\n' +
      '<style id="app-style">' + styleText + "</style>\n" +
      "</head>\n<body>\n" +
      '<div id="root"></div>\n' +
      '<script id="init-data" type="application/json">' + dataJson + "<" + "/script>\n" +
      '<script id="app-js" type="text/plain">' + appJsText + "<" + "/script>\n" +
      "<script>" + BOOTSTRAP_SRC + "<" + "/script>\n" +
      "</body>\n</html>";
    return html;
  }

  function publishScripts(nextScripts, opts) {
    opts = opts || {};
    if (!writable) {
      if (opts.onError) opts.onError("Este repositorio esta em modo somente leitura para voce.");
      return;
    }
    if (capability) {
      attemptPublish(nextScripts, claudeSkills, opts, false);
      return;
    }
    if (supabaseConfigured()) {
      attemptSupabaseSave(nextScripts, opts);
      return;
    }
    if (opts.onError) opts.onError("Nao e possivel salvar alteracoes neste visualizador.");
    else showToast("Nao e possivel salvar alteracoes neste visualizador.", "error");
  }

  function publishSkills(nextSkills, opts) {
    opts = opts || {};
    if (!writable) {
      if (opts.onError) opts.onError("Este repositorio esta em modo somente leitura para voce.");
      return;
    }
    if (capability) {
      attemptPublish(scripts, nextSkills, opts, false);
      return;
    }
    if (supabaseConfigured()) {
      attemptSkillsSupabaseSave(nextSkills, opts);
      return;
    }
    if (opts.onError) opts.onError("Nao e possivel salvar alteracoes neste visualizador.");
    else showToast("Nao e possivel salvar alteracoes neste visualizador.", "error");
  }

  function attemptPublish(nextScripts, nextSkills, opts, isRetry) {
    var html = buildDocument(nextScripts, nextSkills);
    capability.publish(html).then(function () {
      // success: this view reloads automatically to the new version.
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        if (opts.onError) opts.onError("Alguem salvou uma alteracao ao mesmo tempo - atualizando a pagina...");
        return;
      }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
        writable = false;
        showReadonlyBanner();
        if (opts.onError) opts.onError("Voce nao tem permissao para editar este repositorio.");
        return;
      }
      if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
        writable = false;
        showReadonlyBanner();
        if (opts.onError) opts.onError("Salvar nao esta disponivel neste momento.");
        return;
      }
      if (code === "too_large") {
        if (opts.onError) opts.onError("O arquivo e grande demais para ser salvo.");
        return;
      }
      if (code === "rate_limited") {
        if (opts.onError) opts.onError("Muitas alteracoes em pouco tempo - aguarde um instante e tente novamente.");
        return;
      }
      if (code === "upstream_error" && !isRetry) {
        setTimeout(function () { attemptPublish(nextScripts, nextSkills, opts, true); }, 700 + Math.random() * 500);
        return;
      }
      if (opts.onError) opts.onError("Nao foi possivel salvar. Tente novamente.");
    });
  }

  var PAGES = ["scripts", "claudeskills", "apimaker", "cron", "base64", "bfcscript", "apistributos", "apisprocuradoria", "apisenotafly", "apisenotacloud", "apilivroeletronico", "apisfolha", "apisrh", "apisponto", "apiseducacao", "apissaude", "apiscontabil", "apisplanejamento", "apistesouraria", "apisconvenios", "apistransparencia", "apisalmoxarifado", "apiscompras", "apiscontratos", "apisfrotas", "apispatrimonio", "criticastributos", "criticasgestaofiscal", "criticasprotocolo", "criticasfolha", "criticaseducacao", "criticascontabil", "manualwebservicebb", "manualintegracaocbm", "manualpixbbcidadaoweb", "manualregistrosicoob", "manualregistrocaixa"];

  function switchPage(page) {
    if (PAGES.indexOf(page) === -1) return;
    PAGES.forEach(function (p) {
      var sec = qs("#page-" + p);
      if (sec) sec.hidden = (p !== page);
    });
    qsa(".nav-item").forEach(function (btn) {
      var isActive = btn.getAttribute("data-page") === page;
      btn.classList.toggle("active", isActive);
      if (isActive) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
  }

  function wireSidebar() {
    qsa(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () { switchPage(btn.getAttribute("data-page")); });
    });
  }

  function wireNavFolders() {
    qsa(".nav-folder-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var folder = btn.closest(".nav-folder");
        if (!folder) return;
        var isOpen = folder.classList.toggle("is-open");
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
    });
  }

  function wireToolbar() {
    var searchInput = qs("#searchInput");
    var systemFilter = qs("#systemFilter");
    var addBtn = qs("#addBtn");
    if (searchInput) {
      var t;
      searchInput.addEventListener("input", function () {
        clearTimeout(t);
        var val = searchInput.value;
        t = setTimeout(function () { filterText = val; renderGrid(); }, 120);
      });
    }
    if (systemFilter) {
      systemFilter.addEventListener("change", function () { filterSystem = systemFilter.value; renderGrid(); });
    }
    if (addBtn) addBtn.addEventListener("click", function () { openForm(null); });
    var emptyBtn = qs("#emptyActionBtn");
    if (emptyBtn) emptyBtn.addEventListener("click", function () { openForm(null); });
  }

  function wireSkillsToolbar() {
    var searchInput = qs("#skillSearchInput");
    var addBtn = qs("#addSkillBtn");
    if (searchInput) {
      var t;
      searchInput.addEventListener("input", function () {
        clearTimeout(t);
        var val = searchInput.value;
        t = setTimeout(function () { skillFilterText = val; renderSkillsGrid(); }, 120);
      });
    }
    if (addBtn) addBtn.addEventListener("click", function () { openSkillForm(null); });
    var emptyBtn = qs("#skillsEmptyActionBtn");
    if (emptyBtn) emptyBtn.addEventListener("click", function () { openSkillForm(null); });
  }

  function loadInitialData() {
    var node = qs("#init-data");
    var data = { scripts: [], claudeSkills: [] };
    if (node) {
      try { data = JSON.parse(node.textContent) || { scripts: [], claudeSkills: [] }; } catch (e) {}
    }
    scripts = (data && data.scripts) || [];
    claudeSkills = (data && data.claudeSkills) || [];
  }

  function init() {
    var root = qs("#root");
    if (root) root.innerHTML = ROOT_SHELL_HTML;
    loadInitialData();
    wireToolbar();
    wireSkillsToolbar();
    wireSidebar();
    wireNavFolders();
    wireCronBuilder();
    wireBase64Decoder();
    wireScriptMaker();
    renderGrid();
    renderSkillsGrid();

    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("artifact").then(function (cap) {
          capability = cap;
          if (!cap) { writable = false; showReadonlyBanner(); }
        }).catch(function () {
          capability = null; writable = false; showReadonlyBanner();
        });
      } else if (supabaseConfigured()) {
        capability = null;
        writable = true;
        initAuthGate();
      } else {
        capability = null; writable = false; showReadonlyBanner();
      }
    } catch (e) {
      capability = null; writable = false; showReadonlyBanner();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
